<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pham Thanh Dat — Unity Developer & Game Lead</title>
<meta name="description" content="Pham Thanh Dat — Unity Developer & Game Lead. Mobile games from concept to launch since 2014." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --violet:#a78bfa; --pink:#f472b6; --amber:#fbbf24; --cyan:#22d3ee;
    --green:#34d399; --blue:#60a5fa; --red:#f87171; --teal:#2dd4bf;
    --bg:#0a0b12; --bg2:#0e1019; --card:#14161f; --card2:#191c28;
    --ink:#eaecf7; --muted:#9498b8; --soft:#c3c7e0;
    --line:#262a3a; --shadow:0 20px 45px -22px rgba(0,0,0,.85);
    --radius:22px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:var(--bg);
    line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Fredoka',system-ui,sans-serif;font-weight:600;line-height:1.15}
  a{color:inherit;text-decoration:none}
  img{display:block;max-width:100%}
  .wrap{max-width:1120px;margin:0 auto;padding:0 22px}
  section{scroll-margin-top:84px}

  /* ---------- NAV ---------- */
  header.nav{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);
    background:rgba(10,11,18,.78);border-bottom:1px solid var(--line)}
  .nav-inner{display:flex;align-items:center;gap:14px;height:66px}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Fredoka';font-weight:700;font-size:18px}
  .brand .dot{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;
    font-family:'Fredoka';font-weight:700;font-size:15px;
    background:linear-gradient(135deg,var(--violet),var(--pink));box-shadow:0 0 18px -2px var(--violet)}
  .nav-links{display:flex;gap:6px;margin-left:auto}
  .nav-links a{padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--muted);transition:.18s}
  .nav-links a:hover{color:var(--ink);background:rgba(167,139,250,.14)}
  .lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
  .lang button{border:0;background:transparent;font-family:'Fredoka';font-weight:600;font-size:13px;
    padding:7px 13px;cursor:pointer;color:var(--muted);transition:.15s}
  .lang button.active{background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff}
  .menu-toggle{display:none;margin-left:auto;border:1px solid var(--line);background:var(--card);border-radius:12px;
    width:42px;height:42px;cursor:pointer;align-items:center;justify-content:center}
  .menu-toggle span,.menu-toggle span::before,.menu-toggle span::after{content:"";display:block;width:18px;height:2px;background:var(--ink);border-radius:2px;position:relative;transition:.2s}
  .menu-toggle span::before{position:absolute;top:-6px}.menu-toggle span::after{position:absolute;top:6px}

  /* ---------- HERO ---------- */
  .hero{position:relative;padding:74px 0 86px;overflow:hidden;
    background:
      radial-gradient(900px 520px at 12% -10%, rgba(167,139,250,.22), transparent 60%),
      radial-gradient(820px 540px at 100% 0%, rgba(244,114,182,.16), transparent 55%),
      radial-gradient(760px 560px at 60% 120%, rgba(34,211,238,.14), transparent 60%),
      var(--bg);}
  .blob{position:absolute;border-radius:50%;filter:blur(8px);opacity:.4;animation:float 9s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-26px) rotate(8deg)}}
  .hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center;position:relative;z-index:2}
  .eyebrow{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
    color:var(--violet);font-weight:800;font-size:13px;padding:7px 14px;border-radius:999px;box-shadow:var(--shadow)}
  .eyebrow .pulse{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.55)}70%{box-shadow:0 0 0 10px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
  .hero h1{font-size:clamp(34px,5.4vw,60px);font-weight:700;margin:18px 0 6px;letter-spacing:-.5px}
  .hero h1 .grad{background:linear-gradient(120deg,var(--violet),var(--pink) 55%,var(--amber));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero .role{font-family:'Fredoka';font-size:clamp(18px,2.4vw,24px);color:var(--soft);font-weight:500}
  .hero .tagline{color:var(--muted);font-size:18px;font-weight:600;margin:14px 0 26px;max-width:520px}
  .cta{display:flex;flex-wrap:wrap;gap:12px}
  .btn{display:inline-flex;align-items:center;gap:9px;font-family:'Fredoka';font-weight:600;font-size:15px;
    padding:13px 22px;border-radius:999px;cursor:pointer;border:0;transition:.2s;white-space:nowrap}
  .btn-primary{background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff;box-shadow:0 0 30px -6px var(--violet)}
  .btn-primary:hover{transform:translateY(-3px);box-shadow:0 0 40px -4px var(--pink)}
  .btn-ghost{background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--ink)}
  .btn-ghost:hover{transform:translateY(-3px);border-color:var(--violet);color:var(--violet)}

  .avatar-card{position:relative;justify-self:center}
  .avatar{width:230px;height:230px;border-radius:40px;display:grid;place-items:center;
    font-family:'Fredoka';font-weight:700;font-size:96px;color:#fff;position:relative;z-index:2;
    background:linear-gradient(150deg,var(--violet),var(--pink) 60%,var(--amber));
    box-shadow:0 0 70px -10px rgba(167,139,250,.75);animation:bob 5s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  .avatar::after{content:"";position:absolute;inset:-10px;border-radius:48px;border:2px dashed rgba(255,255,255,.4);z-index:-1;animation:spin 26s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .chip{position:absolute;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:9px 14px;font-family:'Fredoka';font-weight:600;
    font-size:13px;color:var(--soft);box-shadow:var(--shadow);z-index:3;animation:float 7s ease-in-out infinite}
  .chip b{color:var(--violet)}

  /* ---------- STATS ---------- */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:54px;position:relative;z-index:2}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px 16px;text-align:center;box-shadow:var(--shadow)}
  .stat .num{font-family:'Fredoka';font-weight:700;font-size:34px;background:linear-gradient(120deg,var(--violet),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
  .stat .lbl{color:var(--muted);font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.5px}

  /* ---------- SECTIONS ---------- */
  .sec{padding:70px 0}
  .sec-head{text-align:center;margin-bottom:42px}
  .sec-head .kicker{font-family:'Fredoka';color:var(--pink);font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:2px}
  .sec-head h2{font-size:clamp(26px,3.6vw,38px);margin-top:4px}
  .sec-head .bar{width:64px;height:5px;border-radius:5px;margin:14px auto 0;background:linear-gradient(90deg,var(--violet),var(--pink),var(--amber))}

  /* About */
  .about{display:grid;grid-template-columns:1.4fr .9fr;gap:26px;align-items:start}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px;box-shadow:var(--shadow)}
  .about p{font-size:17px;color:var(--soft);font-weight:600}
  .info-card .row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line);font-weight:700}
  .info-card .row:last-child{border-bottom:0}
  .info-card .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:0 0 auto}
  .info-card .row small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}

  /* Tech Stack */
  .skill-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
  .skill-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);transition:.2s}
  .skill-card:hover{transform:translateY(-5px);border-color:var(--violet)}
  .skill-card h3{font-size:18px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
  .skill-card .swatch{width:14px;height:14px;border-radius:5px}
  .tags{display:flex;flex-wrap:wrap;gap:8px}
  .tag{font-weight:800;font-size:13px;padding:6px 12px;border-radius:999px;background:rgba(167,139,250,.14);color:var(--violet);border:1px solid transparent}

  /* Experience timeline */
  .timeline{position:relative;max-width:860px;margin:0 auto;padding-left:34px}
  .timeline::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:3px;border-radius:3px;background:linear-gradient(var(--violet),var(--pink),var(--amber))}
  .tl-item{position:relative;margin-bottom:26px}
  .tl-item::before{content:"";position:absolute;left:-33px;top:6px;width:21px;height:21px;border-radius:50%;background:var(--bg);border:4px solid var(--violet);box-shadow:0 0 0 4px rgba(167,139,250,.18)}
  .tl-item.current::before{border-color:var(--green);box-shadow:0 0 0 4px rgba(52,211,153,.2);animation:pulse 2s infinite}
  .tl-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow)}
  .tl-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px;margin-bottom:6px}
  .tl-top h3{font-size:20px}
  .tl-top .co{font-family:'Fredoka';font-weight:600;color:var(--violet);font-size:16px}
  .tl-top .per{margin-left:auto;font-weight:800;font-size:13px;color:var(--muted);background:rgba(255,255,255,.05);padding:4px 12px;border-radius:999px}
  .tl-card .sum{color:var(--soft);font-weight:600;margin-bottom:10px}
  .tl-card ul{list-style:none;display:grid;gap:7px}
  .tl-card li{position:relative;padding-left:22px;font-weight:600;color:var(--muted);font-size:15px}
  .tl-card li::before{content:"";position:absolute;left:0;top:9px;width:9px;height:9px;border-radius:3px;background:linear-gradient(135deg,var(--violet),var(--pink))}
  .badge-now{font-family:'Fredoka';font-weight:600;font-size:12px;color:#06231a;background:var(--green);padding:3px 10px;border-radius:999px}

  /* Projects */
  .featured{display:grid;gap:26px}
  .proj-feat{display:grid;grid-template-columns:1.05fr 1fr;gap:0;background:var(--card);border:1px solid var(--line);border-radius:26px;overflow:hidden;box-shadow:var(--shadow)}
  .proj-feat:nth-child(even){grid-template-columns:1fr 1.05fr}
  .proj-feat:nth-child(even) .pf-media{order:2}
  .pf-media{background:#0c0d15;position:relative;min-height:280px}
  .pf-media .main{width:100%;height:100%;object-fit:cover;object-position:center top;cursor:zoom-in;min-height:280px}
  .pf-thumbs{position:absolute;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px;background:linear-gradient(transparent,rgba(0,0,0,.7))}
  .pf-thumbs img{width:46px;height:46px;object-fit:cover;border-radius:9px;border:2px solid rgba(255,255,255,.45);cursor:pointer;opacity:.65;transition:.15s}
  .pf-thumbs img.active,.pf-thumbs img:hover{opacity:1;border-color:#fff;transform:translateY(-3px)}
  .pf-body{padding:30px}
  .pf-type{display:inline-block;font-family:'Fredoka';font-weight:600;font-size:12px;color:#0a0b12;padding:5px 13px;border-radius:999px;margin-bottom:12px}
  .pf-body h3{font-size:26px;margin-bottom:4px}
  .pf-meta{color:var(--muted);font-weight:800;font-size:14px;margin-bottom:14px}
  .pf-body p{color:var(--soft);font-weight:600;margin-bottom:16px}
  .pf-links{display:flex;flex-wrap:wrap;gap:9px;margin-top:6px}
  .lnk{display:inline-flex;align-items:center;gap:6px;font-family:'Fredoka';font-weight:500;font-size:13px;padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);transition:.18s}
  .lnk:hover{border-color:var(--violet);color:var(--violet);transform:translateY(-2px)}
  .lnk.store{background:linear-gradient(135deg,var(--violet),var(--pink));color:#fff;border-color:transparent}
  .lnk.store:hover{color:#fff;box-shadow:0 0 22px -6px var(--pink)}

  .more-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:30px}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow);transition:.2s;display:flex;flex-direction:column}
  .pcard:hover{transform:translateY(-6px);border-color:var(--violet)}
  .pcard .thumb{aspect-ratio:16/10;background:#0c0d15;overflow:hidden}
  .pcard .thumb img{width:100%;height:100%;object-fit:cover;object-position:center top;cursor:zoom-in;transition:.4s}
  .pcard:hover .thumb img{transform:scale(1.06)}
  .pcard .pc-body{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}
  .pcard h3{font-size:19px}
  .pcard .pc-type{font-weight:800;font-size:12px;color:var(--pink);text-transform:uppercase;letter-spacing:.5px}
  .pcard p{color:var(--muted);font-weight:600;font-size:14px;flex:1}
  .pcard .pc-links{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}

  /* Contact */
  .contact{text-align:center;background:radial-gradient(600px 320px at 50% 0%, rgba(167,139,250,.16), transparent 60%);}
  .contact-card{max-width:680px;margin:0 auto;background:linear-gradient(135deg,var(--violet),var(--pink));
    border-radius:30px;padding:46px 30px;color:#fff;box-shadow:0 0 70px -20px var(--violet)}
  .contact-card h2{font-size:32px}
  .contact-card p{font-weight:700;opacity:.95;margin:10px 0 26px;font-size:17px}
  .contact-links{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  .clink{display:inline-flex;align-items:center;gap:9px;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.35);
    color:#fff;font-family:'Fredoka';font-weight:500;font-size:15px;padding:12px 20px;border-radius:999px;transition:.2s}
  .clink:hover{background:#fff;color:var(--violet);transform:translateY(-3px)}
  footer{text-align:center;padding:30px 0 44px;color:var(--muted);font-weight:700;font-size:14px}

  /* Lightbox */
  .lb{position:fixed;inset:0;background:rgba(4,5,10,.94);z-index:100;display:none;align-items:center;justify-content:center;padding:30px}
  .lb.open{display:flex}
  .lb img{max-width:90vw;max-height:86vh;border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.8)}
  .lb-btn{position:absolute;top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;border:0;cursor:pointer;
    background:rgba(255,255,255,.12);color:#fff;font-size:26px;display:grid;place-items:center;transition:.18s}
  .lb-btn:hover{background:#fff;color:var(--violet)}
  .lb-prev{left:24px}.lb-next{right:24px}
  .lb-close{position:absolute;top:22px;right:26px;width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:24px;cursor:pointer}
  .lb-close:hover{background:#fff;color:var(--violet)}

  .reveal{opacity:0;transform:translateY(26px);transition:opacity .6s ease,transform .6s ease}
  .reveal.in{opacity:1;transform:none}

  @media(max-width:900px){
    .hero-grid,.about{grid-template-columns:1fr}
    .avatar-card{order:-1;margin-bottom:10px}
    .skill-grid,.more-grid{grid-template-columns:repeat(2,1fr)}
    .proj-feat,.proj-feat:nth-child(even){grid-template-columns:1fr}
    .proj-feat:nth-child(even) .pf-media{order:0}
  }
  @media(max-width:620px){
    .nav-links{display:none;position:absolute;top:66px;left:0;right:0;flex-direction:column;background:var(--bg2);border-bottom:1px solid var(--line);padding:10px;gap:4px}
    .nav-links.open{display:flex}
    .menu-toggle{display:flex}
    .stats{grid-template-columns:repeat(2,1fr)}
    .skill-grid,.more-grid{grid-template-columns:1fr}
    .pf-body,.card{padding:22px}
  }
</style>
</head>
<body>

<header class="nav">
  <div class="wrap nav-inner">
    <a class="brand" href="#top"><span class="dot" id="brandDot">PD</span><span id="brandName">Pham Thanh Dat</span></a>
    <nav class="nav-links" id="navLinks"></nav>
    <button class="menu-toggle" id="menuToggle" aria-label="Menu"><span></span></button>
    <div class="lang" id="langToggle">
      <button data-lang="en">EN</button>
      <button data-lang="vi">VI</button>
    </div>
  </div>
</header>

<main id="top">
  <!-- HERO -->
  <section class="hero">
    <div class="blob" style="width:120px;height:120px;background:var(--amber);top:60px;left:6%"></div>
    <div class="blob" style="width:80px;height:80px;background:var(--cyan);top:160px;right:10%;animation-delay:1.5s"></div>
    <div class="blob" style="width:60px;height:60px;background:var(--green);bottom:90px;left:14%;animation-delay:.8s"></div>
    <div class="blob" style="width:90px;height:90px;background:var(--pink);bottom:40px;right:24%;animation-delay:2.2s"></div>
    <div class="wrap">
      <div class="hero-grid">
        <div>
          <span class="eyebrow"><span class="pulse"></span><span id="heroStatus">Unity Developer · Game Lead</span></span>
          <h1>Hi, I'm <span class="grad" id="heroName">Pham Thanh Dat</span></h1>
          <div class="role" id="heroRole"></div>
          <p class="tagline" id="heroTagline"></p>
          <div class="cta" id="heroCta"></div>
        </div>
        <div class="avatar-card">
          <div class="avatar" id="heroAvatar">PD</div>
          <span class="chip" style="top:8px;left:-18px"><b id="chip1">12+</b> <span id="chip1l">yrs Unity</span></span>
          <span class="chip" style="bottom:24px;right:-22px;animation-delay:1.4s"><b id="chip2">20+</b> <span id="chip2l">games</span></span>
        </div>
      </div>
      <div class="stats" id="stats"></div>
    </div>
  </section>

  <section id="about" class="sec wrap">
    <div class="sec-head reveal"><div class="kicker" data-ui="aboutKick">Profile</div><h2 data-ui="aboutTitle"></h2><div class="bar"></div></div>
    <div class="about">
      <div class="card reveal"><p id="aboutText"></p></div>
      <div class="card info-card reveal" id="infoCard"></div>
    </div>
  </section>

  <section id="skills" class="sec wrap">
    <div class="sec-head reveal"><div class="kicker" data-ui="skillsKick"></div><h2 data-ui="skillsTitle"></h2><div class="bar"></div></div>
    <div class="skill-grid" id="skillGrid"></div>
  </section>

  <section id="experience" class="sec wrap">
    <div class="sec-head reveal"><div class="kicker" data-ui="expKick">Journey</div><h2 data-ui="experienceTitle"></h2><div class="bar"></div></div>
    <div class="timeline" id="timeline"></div>
  </section>

  <section id="projects" class="sec wrap">
    <div class="sec-head reveal"><div class="kicker" data-ui="projKick">Portfolio</div><h2 data-ui="featuredTitle"></h2><div class="bar"></div></div>
    <div class="featured" id="featured"></div>
    <div class="sec-head reveal" style="margin-top:56px"><h2 data-ui="moreTitle" style="font-size:26px"></h2></div>
    <div class="more-grid" id="moreGrid"></div>
  </section>

  <section id="contact" class="sec contact">
    <div class="wrap">
      <div class="contact-card reveal">
        <h2 data-ui="contactTitle"></h2>
        <p data-ui="contactSubtitle"></p>
        <div class="contact-links" id="contactLinks"></div>
      </div>
    </div>
  </section>
</main>

<footer><div class="wrap" id="footerNote"></div></footer>

<div class="lb" id="lightbox">
  <button class="lb-close" id="lbClose">&times;</button>
  <button class="lb-btn lb-prev" id="lbPrev">&#8249;</button>
  <img id="lbImg" alt="" />
  <button class="lb-btn lb-next" id="lbNext">&#8250;</button>
</div>

<script>
const PALETTE=['#a78bfa','#f472b6','#22d3ee','#fbbf24','#34d399','#60a5fa','#2dd4bf','#f87171'];
const ICONS={
  email:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>',
  phone:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 3h3l2 5-2 1c1 2 3 4 5 5l1-2 5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 4 5a2 2 0 0 1 2-2"/></svg>',
  linkedin:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5A2.5 2.5 0 1 1 5 8.5a2.5 2.5 0 0 1 0-5zM3 9h4v12H3zM10 9h3.8v1.7h.1c.5-.9 1.8-1.9 3.6-1.9 3.9 0 4.5 2.5 4.5 5.8V21h-4v-5.3c0-1.3 0-2.9-1.8-2.9s-2 1.4-2 2.8V21h-4z"/></svg>',
  github:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-3.2 19.5c.5.1.7-.2.7-.5v-1.7c-2.8.6-3.4-1.3-3.4-1.3-.5-1.2-1.1-1.5-1.1-1.5-.9-.6.1-.6.1-.6 1 .1 1.5 1 1.5 1 .9 1.6 2.4 1.1 3 .8.1-.6.3-1.1.6-1.4-2.2-.3-4.6-1.1-4.6-5a4 4 0 0 1 1-2.7c-.1-.3-.5-1.3.1-2.7 0 0 .8-.3 2.7 1a9.3 9.3 0 0 1 5 0c1.9-1.3 2.7-1 2.7-1 .6 1.4.2 2.4.1 2.7a4 4 0 0 1 1 2.7c0 3.9-2.3 4.7-4.6 5 .4.3.7.9.7 1.9v2.8c0 .3.2.6.7.5A10 10 0 0 0 12 2z"/></svg>',
  web:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 3 2.5 15 0 18M12 3c-2.5 3-2.5 15 0 18"/></svg>',
  location:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  cap:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m2 8 10-5 10 5-10 5z"/><path d="M6 10v5c0 1 3 3 6 3s6-2 6-3v-5"/></svg>',
  play:'<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M4 3l16 9-16 9z"/></svg>',
  apple:'<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M16 13c0 3 2.5 4 2.5 4s-1.7 4.5-3.8 4.5c-1 0-1.7-.7-2.8-.7s-1.9.7-2.8.7C6.8 21.5 4 16.5 4 13c0-3.3 2.2-5 4.3-5 1 0 2 .7 2.7.7.6 0 1.8-.8 3-.7 1.4.1 2.8.7 3.7 2-2.4 1.4-1.7 4.7 0 0M14 5c.6-.8 1-1.8.8-3-1 0-2.2.7-2.9 1.5-.6.7-1 1.7-.9 2.8 1.1.1 2.3-.6 3-1.3z"/></svg>'
};
let DATA=null, LANG='en';

function t(o){return o&&typeof o==='object'?(o[LANG]||o.en||''):(o||'');}
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function linkIcon(label){const l=(label||'').toLowerCase();
  if(l.includes('play')||l.includes('android'))return ICONS.play;
  if(l.includes('app store')||l.includes('ios')||l.includes('apple'))return ICONS.apple;
  if(l.includes('trailer')||l.includes('video')||l.includes('youtube'))return ICONS.play;
  return ICONS.web;}

function render(){
  const d=DATA;
  document.documentElement.lang=LANG;
  document.getElementById('brandDot').textContent=d.profile.initials;
  document.getElementById('heroAvatar').textContent=d.profile.initials;
  document.getElementById('brandName').textContent=d.profile.name;
  document.getElementById('heroName').textContent=d.profile.name;
  document.getElementById('heroStatus').textContent=t(d.profile.title);
  document.getElementById('heroRole').textContent=t(d.profile.title);
  document.getElementById('heroTagline').textContent=t(d.profile.tagline);

  // hero CTAs
  const cta=document.getElementById('heroCta');cta.innerHTML='';
  if(d.contact.email){const b=el('a','btn btn-primary',ICONS.email+'<span>'+(LANG==='vi'?'Liên hệ':'Contact me')+'</span>');b.href='mailto:'+d.contact.email;cta.appendChild(b);}
  (d.contact.links||[]).forEach(l=>{if(l.type==='linkedin'||l.type==='github'){const b=el('a','btn btn-ghost',(ICONS[l.type]||ICONS.web)+'<span>'+l.label+'</span>');b.href=l.url;b.target='_blank';b.rel='noopener';cta.appendChild(b);}});
  if(d.meta.cvUrl){const b=el('a','btn btn-ghost',ICONS.cap+'<span>'+t(d.ui.labels.downloadCV)+'</span>');b.href=d.meta.cvUrl;b.target='_blank';cta.appendChild(b);}

  // hero chips from first two stats
  if(d.stats[0]){document.getElementById('chip1').textContent=d.stats[0].value;document.getElementById('chip1l').textContent=t(d.stats[0].label);}
  if(d.stats[1]){document.getElementById('chip2').textContent=d.stats[1].value;document.getElementById('chip2l').textContent=t(d.stats[1].label);}

  // stats
  const st=document.getElementById('stats');st.innerHTML='';
  d.stats.forEach(s=>{st.appendChild(el('div','stat reveal','<div class="num">'+s.value+'</div><div class="lbl">'+t(s.label)+'</div>'));});

  // nav
  const nav=document.getElementById('navLinks');nav.innerHTML='';
  const navMap={about:'#about',skills:'#skills',experience:'#experience',projects:'#projects',contact:'#contact'};
  Object.keys(navMap).forEach(k=>{if(d.ui.nav[k]){const a=el('a',null,t(d.ui.nav[k]));a.href=navMap[k];a.onclick=()=>nav.classList.remove('open');nav.appendChild(a);}});

  // static ui text
  document.querySelectorAll('[data-ui]').forEach(n=>{const k=n.getAttribute('data-ui');
    const map={aboutKick:{en:'Profile',vi:'Hồ sơ'},skillsKick:{en:'Toolkit',vi:'Công cụ'},expKick:{en:'Journey',vi:'Hành trình'},projKick:{en:'Portfolio',vi:'Portfolio'}};
    if(map[k]){n.textContent=t(map[k]);return;}
    const s=d.ui.sections[k];if(s){n.textContent=t(s);}});

  document.getElementById('aboutText').textContent=t(d.profile.summary);

  // info card
  const info=document.getElementById('infoCard');info.innerHTML='';
  const rows=[
    {ic:ICONS.location,c:PALETTE[2],t:LANG==='vi'?'Địa điểm':'Location',v:t(d.profile.location)},
    {ic:ICONS.cap,c:PALETTE[0],t:t(d.ui.labels.education),v:t(d.profile.education)},
    {ic:ICONS.email,c:PALETTE[1],t:'Email',v:d.contact.email},
    {ic:ICONS.phone,c:PALETTE[4],t:LANG==='vi'?'Điện thoại':'Phone',v:d.contact.phone}
  ];
  rows.forEach(r=>{if(!r.v)return;const row=el('div','row');
    row.innerHTML='<span class="ic" style="background:'+r.c+'">'+r.ic+'</span><span><small>'+r.t+'</small>'+r.v+'</span>';
    info.appendChild(row);});

  // tech stack
  const sg=document.getElementById('skillGrid');sg.innerHTML='';
  d.skills.forEach((s,i)=>{const c=PALETTE[i%PALETTE.length];
    const card=el('div','skill-card reveal');
    card.innerHTML='<h3><span class="swatch" style="background:'+c+'"></span>'+t(s.category)+'</h3>';
    const tg=el('div','tags');
    s.items.forEach(it=>{const sp=el('span','tag',it);sp.style.background=c+'22';sp.style.color=c;sp.style.borderColor=c+'44';tg.appendChild(sp);});
    card.appendChild(tg);sg.appendChild(card);});

  // experience
  const tl=document.getElementById('timeline');tl.innerHTML='';
  d.experience.forEach(x=>{const item=el('div','tl-item reveal'+(x.current?' current':''));
    const now=x.current?'<span class="badge-now">'+t(d.ui.labels.present)+'</span>':'';
    let lis=(x.highlights||[]).map(h=>'<li>'+t(h)+'</li>').join('');
    item.innerHTML='<div class="tl-card"><div class="tl-top"><h3>'+t(x.role)+'</h3><span class="co">'+x.company+'</span>'+now+'<span class="per">'+x.period+'</span></div><div class="sum">'+t(x.summary)+'</div><ul>'+lis+'</ul></div>';
    tl.appendChild(item);});

  // projects
  const feat=document.getElementById('featured');feat.innerHTML='';
  const more=document.getElementById('moreGrid');more.innerHTML='';
  d.projects.forEach((p,pi)=>{
    const c=PALETTE[pi%PALETTE.length];
    const imgs=p.images||[];
    const links=(p.links||[]).map(l=>'<a class="lnk store" href="'+l.url+'" target="_blank" rel="noopener">'+linkIcon(l.label)+l.label+'</a>').join('');
    if(p.featured){
      const node=el('div','proj-feat reveal');
      const thumbs=imgs.length>1?'<div class="pf-thumbs">'+imgs.map((im,k)=>'<img src="'+im+'" data-i="'+k+'" class="'+(k===0?'active':'')+'" alt="">').join('')+'</div>':'';
      node.innerHTML=
        '<div class="pf-media"><img class="main" src="'+imgs[0]+'" alt="'+p.name+'">'+thumbs+'</div>'+
        '<div class="pf-body"><span class="pf-type" style="background:'+c+'">'+t(p.type)+'</span>'+
        '<h3>'+p.name+'</h3><div class="pf-meta">'+t(p.role)+(p.company?' · '+p.company:'')+(p.year?' · '+p.year:'')+'</div>'+
        '<p>'+t(p.description)+'</p>'+
        '<div class="tags">'+(p.tags||[]).map(tg=>'<span class="tag" style="background:'+c+'22;color:'+c+';border-color:'+c+'44">'+tg+'</span>').join('')+'</div>'+
        '<div class="pf-links">'+links+'</div></div>';
      const main=node.querySelector('.main');
      node.querySelectorAll('.pf-thumbs img').forEach(th=>{th.onclick=()=>{main.src=th.src;node.querySelectorAll('.pf-thumbs img').forEach(o=>o.classList.remove('active'));th.classList.add('active');};});
      main.onclick=()=>{const i=imgs.indexOf(main.getAttribute('src'));openLightbox(imgs,i>=0?i:0);};
      feat.appendChild(node);
    }else{
      const node=el('div','pcard reveal');
      node.innerHTML=
        '<div class="thumb"><img src="'+imgs[0]+'" alt="'+p.name+'"></div>'+
        '<div class="pc-body"><span class="pc-type" style="color:'+c+'">'+t(p.type)+'</span>'+
        '<h3>'+p.name+'</h3><p>'+t(p.description)+'</p>'+
        (links?'<div class="pc-links">'+links+'</div>':'')+'</div>';
      node.querySelector('.thumb img').onclick=()=>openLightbox(imgs,0);
      more.appendChild(node);
    }
  });

  // contact links
  const cl=document.getElementById('contactLinks');cl.innerHTML='';
  if(d.contact.email){const a=el('a','clink',ICONS.email+'Email');a.href='mailto:'+d.contact.email;cl.appendChild(a);}
  (d.contact.links||[]).forEach(l=>{if(l.type==='email')return;const a=el('a','clink',(ICONS[l.type]||ICONS.web)+l.label);a.href=l.url;a.target='_blank';a.rel='noopener';cl.appendChild(a);});
  if(d.contact.phone){const a=el('a','clink',ICONS.phone+d.contact.phone);a.href='tel:'+d.contact.phone.replace(/[^0-9+]/g,'');cl.appendChild(a);}

  document.getElementById('footerNote').textContent='© '+new Date().getFullYear()+' '+d.profile.name+' · '+t(d.ui.labels.footerNote);

  setupReveal();
}

// Lightbox
let lbImgs=[],lbIdx=0;
function openLightbox(imgs,i){lbImgs=imgs;lbIdx=i||0;document.getElementById('lbImg').src=lbImgs[lbIdx];document.getElementById('lightbox').classList.add('open');}
function lbStep(n){if(!lbImgs.length)return;lbIdx=(lbIdx+n+lbImgs.length)%lbImgs.length;document.getElementById('lbImg').src=lbImgs[lbIdx];}
function closeLb(){document.getElementById('lightbox').classList.remove('open');}

// Reveal on scroll
let io;
function setupReveal(){
  if(io)io.disconnect();
  io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:.12});
  document.querySelectorAll('.reveal').forEach(n=>io.observe(n));
}

function setLang(l){LANG=l;try{localStorage.setItem('ptd_lang',l);}catch(e){}
  document.querySelectorAll('#langToggle button').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));
  if(DATA)render();}

function init(){
  document.querySelectorAll('#langToggle button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
  document.getElementById('menuToggle').onclick=()=>document.getElementById('navLinks').classList.toggle('open');
  document.getElementById('lbClose').onclick=closeLb;
  document.getElementById('lbPrev').onclick=()=>lbStep(-1);
  document.getElementById('lbNext').onclick=()=>lbStep(1);
  document.getElementById('lightbox').onclick=e=>{if(e.target.id==='lightbox')closeLb();};
  document.addEventListener('keydown',e=>{if(!document.getElementById('lightbox').classList.contains('open'))return;
    if(e.key==='Escape')closeLb();if(e.key==='ArrowRight')lbStep(1);if(e.key==='ArrowLeft')lbStep(-1);});

  let saved;try{saved=localStorage.getItem('ptd_lang');}catch(e){}

  fetch('data.json').then(r=>r.json()).then(d=>{
    DATA=d;LANG=saved||d.meta.defaultLang||'en';
    document.querySelectorAll('#langToggle button').forEach(b=>b.classList.toggle('active',b.dataset.lang===LANG));
    render();
  }).catch(err=>{
    document.getElementById('top').insertAdjacentHTML('afterbegin',
      '<div style="max-width:680px;margin:60px auto;padding:26px;border:1px solid #262a3a;border-radius:20px;text-align:center;font-weight:700;color:#eaecf7">'+
      'Could not load <b>data.json</b>. If you opened this file directly, run a local server:<br>'+
      '<code style="background:#191c28;padding:4px 8px;border-radius:6px;display:inline-block;margin-top:8px">python -m http.server</code><br>'+
      'It works automatically on GitHub Pages.</div>');
    console.error(err);
  });
}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
